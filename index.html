<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tank Battle · 1024 Hackathon</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background: #111;
      color: #eee;
      font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    #app {
      text-align: center;
    }
    canvas {
      display: block;
      background: #1a1a1a;
      border: 1px solid #333;
      image-rendering: pixelated;
    }
    .hint {
      margin-top: 12px;
      font-size: 13px;
      color: #777;
    }
  </style>
</head>
<body>
  <div id="app">
    <canvas id="game" width="640" height="640"></canvas>
    <div class="hint">v0 骨架 · 游戏逻辑开发中</div>
  </div>
</body>
</html>
