name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    name: 语法 + 逻辑自测
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: 安装开发依赖
        run: npm ci

      - name: 代码规范
        run: |
          npx eslint js tests
          npx prettier --check js tests index.html preview.html README.md CHANGELOG.md

      - name: 语法检查
        run: |
          node --check js/utils.js
          node --check js/entities.js
          node --check js/game.js
          node --check tests/run.js
          node --check tests/game-loop.js

      - name: 逻辑自测（纯函数）
        run: node tests/run.js

      - name: 主循环自测（无头）
        run: node tests/game-loop.js

      - name: 静态资源完整性
        run: |
          test -f index.html
          test -f preview.html
          test -f README.md
